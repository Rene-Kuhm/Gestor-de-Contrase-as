<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <title>Crimson Vault Logomark</title>
  <!-- Cuerpo del candado con esquinas chaflanadas (vault shape) -->
  <path d="M 36 52 L 30 58 L 30 100 L 90 100 L 90 58 L 84 52 Z" fill="#9B1B1F"/>
  <!-- Shackle en V angular (la V de Vault) -->
  <path d="M 42 52 L 42 30 L 60 48 L 78 30 L 78 52" stroke="#9B1B1F" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <!-- Detalle dorado: la barra de la cerradura -->
  <rect x="40" y="70" width="40" height="2.5" fill="#F2C70F"/>
  <!-- Detalle dorado: el keyhole -->
  <rect x="56" y="78" width="8" height="8" fill="#F2C70F"/>
</svg>
