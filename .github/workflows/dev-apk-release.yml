name: Build signed dev APK and publish to GitHub Releases

# Rebuilds the signed APK on every push to master and overwrites the
# `dev-latest` GitHub Release with the new asset. The native
# UpdateChannel queries api.github.com/repos/<owner>/<repo>/releases
# /tags/dev-latest, so this single tag acts as the "rolling latest"
# channel for internal testing.
#
# The APK must keep the same signing key across builds or Android
# will reject in-place updates. This workflow therefore requires the
# VAULTA_UPLOAD_* secrets below and publishes a release APK instead
# of an ephemeral debug-signed APK.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build APK + publish to dev-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.VAULTA_UPLOAD_KEYSTORE_BASE64 }}" || (echo "Missing VAULTA_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.VAULTA_UPLOAD_STORE_PASSWORD }}" || (echo "Missing VAULTA_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "${{ secrets.VAULTA_UPLOAD_KEY_ALIAS }}" || (echo "Missing VAULTA_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.VAULTA_UPLOAD_KEY_PASSWORD }}" || (echo "Missing VAULTA_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.VAULTA_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Build signed APK
        env:
          VAULTA_UPLOAD_STORE_FILE: upload-keystore.jks
          VAULTA_UPLOAD_STORE_PASSWORD: ${{ secrets.VAULTA_UPLOAD_STORE_PASSWORD }}
          VAULTA_UPLOAD_KEY_ALIAS: ${{ secrets.VAULTA_UPLOAD_KEY_ALIAS }}
          VAULTA_UPLOAD_KEY_PASSWORD: ${{ secrets.VAULTA_UPLOAD_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Resolve APK path
        id: apk
        run: |
          APK=$(ls -1 build/app/outputs/flutter-apk/app-release.apk | head -n 1)
          PUBLISH_APK=build/app/outputs/flutter-apk/vaulta.apk
          cp "$APK" "$PUBLISH_APK"
          echo "apk_path=$PUBLISH_APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c %s "$PUBLISH_APK")" >> "$GITHUB_OUTPUT"

      - name: Compute changelog
        id: changelog
        run: |
          # Recent commits since the last successful run of this job,
          # or all commits from today if there is no previous run.
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 30)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          test -n "$VERSION" || (echo "Could not read pubspec version" && exit 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove legacy APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in app-debug.apk app-release.apk; do
            gh release delete-asset dev-latest "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes || true
          done

      - name: Publish to dev-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Dev latest
          body: |
            Rolling signed release APK of Vaulta. Updated automatically on
            every push to `master`.

            Vaulta version: ${{ steps.app_version.outputs.version }}

            Recent commits in this build:
            ${{ steps.changelog.outputs.changelog }}

            Install with:
            ```
            adb install -r vaulta.apk
            ```
            or open the Settings screen in the running app and tap
            "Buscar actualizaciones".
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
          # `overwrite_files: true` lets the action replace the previous
          # vaulta.apk asset with a fresh APK. We keep the tag name
          # `dev-latest` stable so the native side always knows where
          # to look.
          overwrite_files: true
          # Pruning the existing release's other assets is a no-op for
          # us — we only ever ship the one APK.
          prerelease: false
          draft: false
