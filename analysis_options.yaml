# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# Hygiene hardening per ADR-005.
#
# `public_member_api_docs` is active but scoped to `lib/core/**` via
# `analyzer.exclude` below. The `lib/app/` and `lib/features/` trees
# are excluded so the rule doesn't generate noise outside the
# cryptographic and sync core. See ADR-005 for the rationale and
# `openspec/changes/vaulta-public-api-docs/` for the rollout.
analyzer:
  errors:
    # `public_member_api_docs` is scoped to `lib/**` (initially was
    # just `lib/core/**`; extended to the whole library in
    # `vaulta-public-api-docs-extended`). Severity is `info` because
    # `lib/app/` and `lib/features/` still have undocumented public
    # members; tightening to `warning` is the explicit goal once
    # `flutter analyze` reports 0 issues across the whole `lib/`.
    public_member_api_docs: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional ones. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  rules:
    # --- Hygiene hardening per ADR-005 ---
    # These rules are enforced going forward. Existing violations are
    # suppressed per-file with `// ignore_for_file: <rule>` (see ADR-005
    # for the gradual rollout policy).
    prefer_const_constructors: true
    prefer_const_declarations: true
    unawaited_futures: true
    avoid_dynamic_calls: true
    public_member_api_docs: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
